[project]
name = "pai"
version = "0.2.0"
description = "Placement AI (PAI) — student counselor backend (FastAPI + Supabase + OpenAI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "cryptography>=43.0.0",
    "psycopg[binary]>=3.2.0",
    "langgraph>=0.2.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "certifi>=2026.7.22",
    "langgraph-checkpoint-postgres>=3.1.1",
    "agentspan>=0.2.0",
    "tavily-python>=0.5.0",
    "pycountry>=24.6.0",
    "phonenumbers>=9.0.36",
    "pypdf>=6.16.1",
    "pymupdf>=1.24.0",
    "pgvector>=0.3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.fastapi]
entrypoint = "pai.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pai"]

[tool.hatch.build.targets.wheel.force-include]
"src/pai/intelligences/counselor/prompts" = "pai/intelligences/counselor/prompts"
"src/pai/intelligences/vault/prompts" = "pai/intelligences/vault/prompts"
"src/pai/intelligences/documents/data" = "pai/intelligences/documents/data"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
